services:
  - type: web
    name: hextech-billiards-server
    runtime: node
    plan: free
    # 从仓库根目录构建
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
    # Render 自动注入 PORT 环境变量，服务器通过 process.env.PORT 读取
    # WebSocket 连接地址示例：wss://hextech-billiards-server.onrender.com
